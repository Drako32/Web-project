<section class="section-soft"><div class="container"><div class="auth-wrap"><div class="auth-card bg-white">
    <div class="eyebrow mb-2">Welcome Back</div><h1 class="h2 fw-bold">Login</h1><p class="muted">This form is part of the static frontend. Real login requires a backend.</p>
    <form class="demo-form" id="loginForm">
        <div class="mb-3"><label class="form-label" for="loginEmail">Email Address</label><input class="form-control" id="loginEmail" type="email" required placeholder="name@example.com"></div>
        <div class="mb-3"><label class="form-label" for="loginPassword">Password</label><input class="form-control" id="loginPassword" type="password" required minlength="6" placeholder="Enter your password"></div>
        <button class="btn btn-primary w-100 rounded-pill" type="submit">Log In</button>
    </form>
    <p class="text-center mt-4 mb-0">Don't have an account? <a href="#register">Sign up</a></p>
</div></div></div></section>
