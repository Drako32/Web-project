<section class="section-soft"><div class="container"><div class="auth-wrap"><div class="auth-card bg-white">
    <div class="eyebrow mb-2">Start Exploring</div><h1 class="h2 fw-bold">Register</h1><p class="muted">This is a static form and does not create a real user account yet.</p>
    <form class="demo-form" id="registerForm">
        <div class="mb-3"><label class="form-label" for="registerName">Full Name</label><input class="form-control" id="registerName" required placeholder="Your name"></div>
        <div class="mb-3"><label class="form-label" for="registerEmail">Email Address</label><input class="form-control" id="registerEmail" type="email" required placeholder="name@example.com"></div>
        <div class="mb-3"><label class="form-label" for="registerPassword">Password</label><input class="form-control" id="registerPassword" type="password" required minlength="6" placeholder="At least 6 characters"></div>
        <div class="mb-3"><label class="form-label" for="registerPasswordAgain">Confirm Password</label><input class="form-control" id="registerPasswordAgain" type="password" required minlength="6" placeholder="Confirm Password"></div>
        <button class="btn btn-primary w-100 rounded-pill" type="submit">Create Account</button>
    </form>
    <p class="text-center mt-4 mb-0">Already have an account? <a href="#login">Log In</a></p>
</div></div></div></section>
